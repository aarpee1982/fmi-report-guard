name: Monitor FMI Reports

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      audit_initial:
        description: "Audit currently visible reports instead of seeding state only"
        required: false
        type: boolean
        default: false
      force_url:
        description: "Optional specific report URL to audit"
        required: false
        type: string
      benchmark_release_tag:
        description: "Optional GitHub Release tag containing fmi_global_benchmarks.sqlite or .zip"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: fmi-report-guard-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Download benchmark DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHMARK_DB_URL: ${{ vars.FMI_BENCHMARK_DB_URL }}
          BENCHMARK_RELEASE_TAG: ${{ inputs.benchmark_release_tag || vars.FMI_BENCHMARK_DB_RELEASE_TAG }}
        run: |
          mkdir -p data
          if [ -n "${BENCHMARK_DB_URL}" ]; then
            curl -L --fail "${BENCHMARK_DB_URL}" -o data/fmi_global_benchmarks.sqlite
          fi
          if [ ! -f data/fmi_global_benchmarks.sqlite ] && [ -n "${BENCHMARK_RELEASE_TAG}" ]; then
            gh release download "${BENCHMARK_RELEASE_TAG}" --pattern "fmi_global_benchmarks.sqlite*" --dir data
          fi
          if [ -f data/fmi_global_benchmarks.sqlite.zip ]; then
            unzip -o data/fmi_global_benchmarks.sqlite.zip -d data
          fi
          if [ -f data/fmi_global_benchmarks.sqlite ]; then
            echo "FMI_BENCHMARK_DB=${PWD}/data/fmi_global_benchmarks.sqlite" >> "${GITHUB_ENV}"
            echo "Benchmark DB ready at ${PWD}/data/fmi_global_benchmarks.sqlite"
          else
            echo "Benchmark DB not configured. Hierarchy checks will be skipped."
          fi

      - name: Run monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_INITIAL: ${{ inputs.audit_initial }}
          FORCE_URL: ${{ inputs.force_url }}
        run: |
          EXTRA_ARGS=()
          if [ "${AUDIT_INITIAL}" = "true" ]; then
            EXTRA_ARGS+=(--audit-initial)
          fi
          if [ -n "${FORCE_URL}" ]; then
            EXTRA_ARGS+=(--force-url "${FORCE_URL}")
          fi
          if [ -n "${FMI_BENCHMARK_DB}" ]; then
            EXTRA_ARGS+=(--benchmark-db "${FMI_BENCHMARK_DB}")
          fi
          python -m fmi_report_guard.main \
            --state-path state/seen_reports.json \
            --artifacts-dir artifacts \
            --pages 2 \
            --records-per-page 150 \
            --max-new 25 \
            "${EXTRA_ARGS[@]}"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fmi-report-guard-run
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        run: |
          if [ -z "$(git status --porcelain -- state/seen_reports.json state/fmi_title_index.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_reports.json state/fmi_title_index.json
          git commit -m "chore: update FMI guard state"
          git push
